<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Service-Hub — demo</title>
<style>
:root{--bg:#14161A;--s1:#1D2026;--s2:#242830;--bd:#2C313A;--bdl:#3A404B;
--tx:#EAE8E2;--mu:#8A909B;--am:#F5A524;--gr:#34C759;--rd:#FF453A;--bl:#5AA9FF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
font-size:14px;line-height:1.55;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.dsp{font-family:"Arial Narrow","Helvetica Neue",sans-serif;letter-spacing:.02em}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--s1);border:1px solid var(--bd);
border-radius:9px;padding:11px 13px;color:var(--tx);outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--am)}
textarea{resize:vertical;min-height:70px}

header{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:12px 16px;
border-bottom:1px solid var(--bd);background:var(--s1)}
.mk{width:28px;height:28px;border-radius:7px;background:var(--am);display:flex;align-items:center;
justify-content:center;flex-shrink:0}
.wm{font-family:"Arial Narrow",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;
letter-spacing:.02em;white-space:nowrap}
.wm i{font-style:normal;color:var(--am)}
.role{margin-left:auto;font-size:11px;color:var(--mu);background:var(--s2);padding:4px 10px;border-radius:999px}

main{flex:1;overflow-y:auto;padding:18px;max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
nav{flex-shrink:0;display:flex;border-top:1px solid var(--bd);background:var(--s1);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
font-size:10.5px;color:var(--mu)}
nav button.on{color:var(--am);font-weight:700}
nav svg{width:20px;height:20px}

h1{font-family:"Arial Narrow",sans-serif;font-weight:700;font-size:27px;text-transform:uppercase;
letter-spacing:.02em;margin-bottom:2px}
.sub{color:var(--mu);font-size:12.5px;margin-bottom:16px}
h2{font-size:15px;font-weight:650;margin:20px 0 9px}
.lbl{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:9px}
.card.am{border-color:rgba(245,165,36,.45)}
.in{background:var(--s2);border-radius:9px;padding:11px;margin-top:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mu);font-size:12.5px}

.btn{display:block;width:100%;padding:13px;border-radius:10px;font-weight:700;text-align:center;
font-size:15px;margin-top:9px}
.bp{background:var(--am);color:#151515;font-family:"Arial Narrow",sans-serif;text-transform:uppercase;font-size:16px}
.bd2{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}
.bg2{background:var(--gr);color:#0a1a0e}
.br2{border:1px solid rgba(255,69,58,.4);color:var(--rd)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:7px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:104px;font-size:13.5px;padding:10px}

.pill{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.p-am{color:var(--am);background:rgba(245,165,36,.16)}
.p-gr{color:var(--gr);background:rgba(52,199,89,.16)}
.p-rd{color:var(--rd);background:rgba(255,69,58,.16)}
.p-bl{color:var(--bl);background:rgba(90,169,255,.16)}
.p-mu{color:var(--mu);background:rgba(138,144,155,.16)}

.av{width:38px;height:38px;border-radius:50%;background:rgba(245,165,36,.15);color:var(--am);
display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
font-family:"Arial Narrow",sans-serif}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.chip.on{border-color:var(--am);background:rgba(245,165,36,.12);color:var(--am);font-weight:600}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.slot{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center;font-size:13px}
.slot.on{border-color:var(--am);background:rgba(245,165,36,.12);color:var(--am);font-weight:700}
.slot.off{opacity:.3}
.slot.gone{opacity:.42;text-decoration:line-through}
.slot b{display:block;font-size:16px;font-family:"Arial Narrow",sans-serif}
.slot span{display:block;font-size:10px;color:var(--mu);margin-top:2px}

.prog{display:flex;gap:4px;margin-bottom:16px}
.prog div{flex:1;height:4px;border-radius:2px;background:var(--bd)}
.prog div.on{background:var(--am)}

.stat{background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:12px;text-align:center;
display:block;width:100%;font-family:inherit;color:inherit}
button.stat:active{background:var(--s2)}
.stat b{display:block;font-family:"Arial Narrow",sans-serif;font-size:25px;line-height:1.1}
.stat span{font-size:10.5px;color:var(--mu)}

.msg{max-width:78%;padding:9px 12px;border-radius:14px;margin-bottom:7px;font-size:13.5px}
.msg.me{background:var(--am);color:#151515;margin-left:auto;border-bottom-right-radius:4px}
.msg.you{background:var(--s2);border-bottom-left-radius:4px}
.msg.sys{max-width:100%;background:var(--s2);color:var(--mu);text-align:center;font-size:12px;border-radius:9px}
.msg.sys em{display:block;font-size:10px;margin-top:3px;font-style:normal;opacity:.7}
.mtime{font-size:10px;color:var(--mu);margin-bottom:9px}
.mtime.me{text-align:right}

.star{color:var(--am);font-size:15px;letter-spacing:1px}
.star .off{color:var(--bd)}
.empty{text-align:center;color:var(--mu);padding:32px 16px;font-size:13.5px}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bdl);flex-shrink:0;
display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--am);border-color:var(--am)}
.chk.on::after{content:"";width:5px;height:9px;border:solid #151515;border-width:0 2.5px 2.5px 0;
transform:rotate(45deg);margin-top:-2px}
.tabs{display:flex;gap:6px;margin-bottom:13px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;background:var(--s2);color:var(--mu)}
.tabs button.on{background:var(--am);color:#151515;font-weight:700}
.back{color:var(--mu);font-size:13px;margin-bottom:10px;display:block}
.dot{width:8px;height:8px;border-radius:50%;background:var(--am);display:inline-block;
animation:p 1.6s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.note{background:rgba(245,165,36,.08);border:1px solid rgba(245,165,36,.3);border-radius:10px;
padding:11px 13px;font-size:12.5px;margin-bottom:12px}
</style>
</head>

const nrm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
const dfmt=d=>{const x=new Date(d+"T00:00:00");
  return DAY[L()][x.getDay()]+" "+x.getDate()+" "+MON[L()][x.getMonth()];};
const days=d=>Math.round((new Date(d+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
const rate=id=>{const rs=S.reviews.filter(x=>x.shop===id);
  if(!rs.length)return{a:4.3,n:0};
  return{a:(rs.reduce((s,x)=>s+x.rating,0)+4.3*3)/(rs.length+3),n:rs.length};};
const stars=n=>{let h="";for(let i=1;i<=5;i++)h+=`<span class="${i<=Math.round(n)?'':'off'}">★</span>`;
  return `<span class="star">${h}</span>`;};
const ago=n=>!n?t("today_s"):L()?`${n} ${t("d_s")} ${t("ago_d")}`:`${t("ago_d")} ${n} ${t("d_s")}`;
const esc=s=>(s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const total=q=>q.items.filter(i=>i.ok).reduce((s,i)=>s+i.p,0);

const app=document.getElementById("app");
let _scr="";
function r(){
  /* păstrează poziția de scroll, derularea chip-urilor și focusul când rămâi pe același ecran */
  const key=[S.role,S.nav,S.sel,S.step,S.thread,S.sett,S.tab,S.filt].join("|");
  const same=key===_scr, y=app.scrollTop;
  const cx=[...app.querySelectorAll(".chips")].map(e=>e.scrollLeft);
  const ae=document.activeElement, fid=ae&&ae.id&&app.contains(ae)?ae.id:null;
  let sel=null; try{if(fid&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd];}catch(e){}
  document.getElementById("roleBtn").textContent=S.role==="shop"?t("im_shop"):t("im_client");
  app.innerHTML = S.role==="shop"?shopView():clientView();
  drawNav();
  if(same){app.scrollTop=y;app.querySelectorAll(".chips").forEach((e,i)=>{if(cx[i])e.scrollLeft=cx[i];});}
  else app.scrollTop=0;
  if(same&&fid){const el=document.getElementById(fid);
    if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  _scr=key; save();
}

function clientView(){
  if(S.nav==="search")return S.sel?(S.step?flow():shopPage()):searchPage();
  if(S.nav==="acc"&&S.sett==="pickcar")return pickCar();
  if(S.nav==="acc"&&S.sett&&S.sett.startsWith("ch_"))return carHist(S.sett.slice(3));
  if(S.nav==="garage")return S.sel?carForm():(S.sett?carHist():garage());
  if(S.nav==="bk")return myBookings();
  if(S.nav==="msg")return S.thread?chat(S.thread):threads();
  return account();
}

function searchPage(){
  const al=[];
  S.cars.forEach(c=>[["itp","ITP"],["rca","RCA"],["vig",L()?"Vignette":"Rovinietă"]].forEach(([k,n])=>{
    if(c[k]){const d=days(c[k]);if(d<=30)al.push({n,c,d});}}));
  al.sort((a,b)=>a.d-b.d);
  let list=S.shops.filter(s=>{
    if(S.city&&s.city!==S.city)return false;
    if(S.cat&&!s.svc.some(x=>CATM[S.cat].includes(x)))return false;
    if(!S.q)return true;
    const q=nrm(S.q);
    return nrm(s.name).includes(q)||nrm(s.city).includes(q)||s.svc.some(x=>nrm(sv(x)).includes(q));
  }).map(s=>({s,r:rate(s.id)})).sort((a,b)=>b.r.a-a.r.a||b.r.n-a.r.n);

  const hit=s=>{if(!S.q)return null;const q=nrm(S.q);
    const m=s.svc.find(x=>nrm(sv(x)).includes(q));return m?sv(m):null;};

  return `<h1>${t("nav_search")}</h1><div class="sub">${S.shops.length} ${t("shops_n")}</div>
  ${al.length?`<button class="card am" style="width:100%;text-align:left" onclick="go('garage')">
    <div class="row"><div>
      <div style="font-weight:650;font-size:13.5px">${al[0].n} · ${al[0].c.make} ${al[0].c.model}
        ${al[0].d<0?`<span style="color:var(--rd)">${t("exp_by")} ${-al[0].d} ${t("days_")}</span>`:
          al[0].d===0?`<span style="color:var(--rd)">${t("exp_today")}</span>`:
          `<span style="color:var(--am)">${t("in_")} ${al[0].d} ${t("days_")}</span>`}</div>
      ${al.length>1?`<div class="mut">+${al.length-1} ${L()?"more to check":"de verificat"}</div>`:""}
    </div><span style="color:var(--mu)">›</span></div></button>`:""}
  <input id="q_search" placeholder="${t("ph_search")}" value="${esc(S.q)}"
    oninput="S.q=this.value;r()" style="margin-bottom:10px">
  <div class="chips">
    <button class="chip ${!S.cat?'on':''}" onclick="S.cat=null;r()">${t("all")}</button>
    ${Object.keys(CATM).map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';r()">${cn(c)}</button>`).join("")}
  </div>
  <div class="chips">
    <button class="chip ${!S.city?'on':''}" onclick="S.city=null;r()">${t("all_cities")}</button>
    ${[...new Set(S.shops.map(s=>s.city))].map(c=>
      `<button class="chip ${S.city===c?'on':''}" onclick="S.city='${c}';r()">${c}</button>`).join("")}
  </div>
  <div class="mut" style="margin-bottom:8px">${list.length} ${t("found")}</div>
  ${list.length?list.map(({s,r:rr})=>{const h=hit(s);return`
   <button class="card" style="width:100%;text-align:left" onclick="S.sel='${s.id}';r()">
    <div class="row"><div style="display:flex;gap:11px;align-items:center;min-width:0">
      <span class="av">${ini(s.name)}</span>
      <div style="min-width:0"><div style="font-weight:650">${s.name}</div>
      <div class="mut">${stars(rr.a)} ${rr.a.toFixed(1)} · ${rr.n} ${t("reviews")} · ${s.city} · ${s.svc.length} ${t("services")}</div></div>
    </div><span style="color:var(--mu)">›</span></div>
    ${h?`<div class="mut" style="color:var(--am);margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)">${t("offers")}: ${h}</div>`:""}
   </button>`}).join(""):`<div class="empty">${t("no_res")}</div>`}

}

function flow(){
  const d=S.draft,s=shop(d.shop);
  const bar=`<div class="prog">${[1,2,3,4].map(i=>`<div class="${S.step>=i?'on':''}"></div>`).join("")}</div>`;
  const back=`<button class="back" onclick="S.step--;if(!S.step)S.draft={};r()">‹ ${t("back")}</button>`;

  if(S.step===1)return `${back}${bar}<h1>${t("need")}</h1><div class="sub">${s.name}</div>
   ${Object.entries(CATM).map(([c,ids])=>{const av=ids.filter(i=>s.svc.includes(i));
     return av.length?`<div class="lbl" style="margin-top:14px">${cn(c)}</div>
     ${av.map(i=>`<button class="card" style="width:100%;text-align:left" onclick="S.draft.svc='${i}';S.step=2;r()">${sv(i)}</button>`).join("")}`:"";}).join("")}`;

  if(S.step===2){
    const ds=[];for(let i=1;ds.length<12;i++){const dt=iso(i);
      if(new Date(dt+"T00:00:00").getDay()===0)continue;ds.push(dt);}
    return `${back}${bar}<h1>${t("pick_day")}</h1><div class="sub">${sv(d.svc)} · ${s.name}</div>
    <div class="grid3">${ds.map(dt=>{const left=s.cap-taken(s.id,dt).length;
      return `<button class="slot ${left<=0?'off':''} ${d.date===dt?'on':''}" ${left<=0?'disabled':''}
        onclick="S.draft.date='${dt}';S.step=3;r()">
        <b>${new Date(dt+"T00:00:00").getDate()}</b>

window.fin=id=>{const b=S.bookings.find(x=>x.id===id);

  if(!o)return alert(t("odo_need"));

  const prev=lastOdo(b.car);
  if(prev&&o<prev)return alert(`${t("odo_low")} ${prev.toLocaleString("ro-RO")} km. ${t("odo_check")}`);

function reports(){
  const per=S.per||"all";
  const lim={month:30,q:90,year:365,all:99999}[per]||99999;
  const inP=b=>Math.abs(days(b.date))<=lim;
  const all=S.bookings.filter(b=>b.shop===MY);
  const done=all.filter(b=>b.status==="done"&&inP(b));
  const sum=done.reduce((a,b)=>a+(b.cost||0),0);
  const avg=done.length?Math.round(sum/done.length):0;

  if(done.length<3)return `<button class="back" onclick="S.sett=null;r()">‹ ${t("nav_acc")}</button>
    <h1>${t("reports")}</h1><div class="empty">${t("rep_empty")}</div>`;

  // pe luni
  const byM={};
  done.forEach(b=>{const d=new Date(b.date+"T00:00:00");
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    byM[k]=(byM[k]||0)+(b.cost||0);});

  const mx=Math.max(...ms.map(k=>byM[k]),1);

  // pe servicii
  const byS={};
  done.forEach(b=>{byS[b.svc]=byS[b.svc]||{n:0,v:0};byS[b.svc].n++;byS[b.svc].v+=(b.cost||0);});
  const svcs=Object.entries(byS).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  const smx=Math.max(...svcs.map(x=>x[1].v),1);

  // clienți (în demo, un singur client — se calculează pe numărul de înmatriculare)
  const plates={};
  all.filter(b=>b.status==="done").forEach(b=>{const pl=(b.car.split(" · ")[1]||b.car).trim();
    plates[pl]=(plates[pl]||0)+1;});
  const uniq=Object.keys(plates).length;
  const ret=Object.values(plates).filter(n=>n>1).length;
  const retPct=uniq?Math.round(ret/uniq*100):0;

  <div class="grid3" style="margin-bottom:14px">

    <div class="stat"><b>${done.length}</b><span>${t("jobs_r")}</span></div>
    <div class="stat"><b style="color:var(--am);font-size:20px">${avg.toLocaleString("ro-RO")}</b><span>${t("avg_job")}</span></div>
  </div>

  <h2>${t("rev_month")}</h2>
  <div class="card">
    <div style="display:flex;align-items:flex-end;gap:5px;height:120px">
      ${ms.map(k=>{const h=Math.max(6,byM[k]/mx*100);
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font-size:9.5px;color:var(--mu)" class="mono">${byM[k]>=1000?(byM[k]/1000).toFixed(1)+"k":byM[k]}</span>
          <div style="width:100%;height:${h}px;background:var(--am);border-radius:4px 4px 0 0"></div>
          <span style="font-size:9.5px;color:var(--mu)">${MON[L()][+k.slice(5,7)-1]}</span>
        </div>`;}).join("")}
    </div>
  </div>

  <h2>${t("by_svc")}</h2>
  <div class="card">
    ${svcs.map(([k,v])=>`<div style="margin-bottom:11px">
      <div class="row" style="font-size:13px;margin-bottom:4px">
        <span>${sv(k)} <span class="mut">· ${v.n}</span></span>
        <span class="mono" style="color:var(--am)">${lei(v.v)}</span></div>
      <div style="height:6px;background:var(--s2);border-radius:3px;overflow:hidden">
        <div style="width:${v.v/smx*100}%;height:100%;background:var(--am)"></div></div>

  </div>

  <h2>${t("clients_t")}</h2>
  <div class="card">
    <div class="row"><span class="mut">${t("uniq")}</span><b class="mono">${uniq}</b></div>

      <b class="mono" style="color:${retPct>=30?'var(--gr)':'var(--am)'}">${ret} · ${retPct}%</b></div>
    <div class="row" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--bd)">

function cuiOK(v){v=(v||"").toUpperCase().replace(/^RO/,"").replace(/\D/g,"");
  if(v.length<2||v.length>10)return false;
  const ctrl=+v.slice(-1);const body=v.slice(0,-1);
  const K="753217532";const k=K.slice(K.length-body.length);
  let sum=0;for(let i=0;i<body.length;i++)sum+=(+body[i])*(+k[i]);
  let rest=(sum*10)%11; if(rest===10)rest=0;
  return rest===ctrl;}
function ibanOK(v){v=(v||"").toUpperCase().replace(/\s/g,"");
  if(!/^RO[0-9]{2}[A-Z0-9]{20}$/.test(v))return false;
  const r=v.slice(4)+v.slice(0,4);
  let n="";for(const c of r)n+=/[A-Z]/.test(c)?(c.charCodeAt(0)-55):c;
  let m=0;for(const c of n)m=(m*10+ +c)%97;
  return m===1;}
window.setCui=v=>{if(v&&!cuiOK(v))return alert(t("bad_cui"));shop(MY).cui=v.toUpperCase();save();r();};
window.setIban=v=>{if(v&&!ibanOK(v))return alert(t("bad_iban"));shop(MY).iban=v.toUpperCase().replace(/\s/g,"");save();r();};
window.setZip=v=>{if(v&&!/^[0-9]{6}$/.test(v))return alert(t("bad_zip"));shop(MY).zip=v;save();r();};
window.setVat=b=>{shop(MY).vatPayer=b;save();r();};
window.copyAddr=()=>{const s=shop(MY);s.legalAddr=`${s.street||s.addr}, ${s.city}`;save();r();};
window.chg=(k,d)=>{const s=shop(MY);s[k]=Math.max(k==="cap"?1:0,s[k]+d);save();r();};
window.tsvc=i=>{const s=shop(MY);s.svc=s.svc.includes(i)?s.svc.filter(x=>x!==i):[...s.svc,i];save();r();};

function threads(){
  const ids=Object.keys(S.msgs).filter(k=>S.msgs[k].length);
  if(!ids.length)return `<h1>${t("nav_msg")}</h1><div class="empty">${t("no_conv")}</div>`;
  return `<h1>${t("nav_msg")}</h1>
  ${ids.map(id=>{const m=S.msgs[id],last=m[m.length-1],s=shop(id);
    const nm=S.role==="shop"?"Eduard L.":s.name;
    return `<button class="card" style="width:100%;text-align:left" onclick="S.thread='${id}';r()">
     <div style="display:flex;gap:11px;align-items:center">
      <span class="av">${ini(nm)}</span>
      <div style="min-width:0;flex:1"><b>${nm}</b>
      <div class="mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(last.b)}</div></div>
     </div></button>`;}).join("")}`;
}
function chat(id){
  const s=shop(id),nm=S.role==="shop"?"Eduard L.":s.name;
  const ms=S.msgs[id]||[];
  return `<button class="back" onclick="S.thread=null;r()">‹ ${t("nav_msg")}</button>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
    <span class="av">${ini(nm)}</span><b>${nm}</b></div>
  ${ms.map(m=>{
    if(m.f==="sys")return `<div class="msg sys">${esc(m.b)}<em>${t("auto_msg")}</em></div>`;
    const mine=(S.role==="shop")===(m.f==="shop");
    return `<div class="msg ${mine?'me':'you'}">${esc(m.b)}</div>`;}).join("")}
  <div style="display:flex;gap:7px;margin-top:14px">
    <input id="mi" placeholder="${t("ph_msg")}" onkeydown="if(event.key==='Enter')snd('${id}')">
    <button class="btn bp" style="width:52px;margin:0;padding:11px" onclick="snd('${id}')">→</button>
  </div>`;
}
window.snd=id=>{const i=document.getElementById("mi");if(!i.value.trim())return;
  (S.msgs[id]=S.msgs[id]||[]).push({f:S.role==="shop"?"shop":"me",b:i.value.trim(),m:0});r();};
