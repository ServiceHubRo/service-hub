name: Android app

# The Android test app (T20a): the same web app, built against the TEST Supabase project and
# wrapped by Capacitor, as an APK to install straight on a phone (no store). Built on every pull
# request and on main; the file is under the run's "Artifacts" for 14 days.
#
# Needs two repository VARIABLES (public values, the same as the deploy previews use):
#   TEST_SUPABASE_URL        https://<test-ref>.supabase.co
#   TEST_SUPABASE_ANON_KEY   the test project's publishable (anon) key
# Without them the app is still built (so the build itself is checked), but it cannot reach a
# database: it shows the red bar saying so.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android test app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
      # Errors from the phone app reach Sentry too (the same public DSN as the site; none = off),
      # tagged as their own environment and with the commit.
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      CONTEXT: android-test
      COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check the test project's address is set
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Aplicația Android::Lipsesc variabilele TEST_SUPABASE_URL și TEST_SUPABASE_ANON_KEY (GitHub → Settings → Secrets and variables → Actions → Variables): aplicația se construiește, dar nu ajunge la baza de date."
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Notifications in the app (T20b): Firebase's config for this app, from the
      # GOOGLE_SERVICES_JSON secret. Without it the app is built without notifications.
      - name: Firebase config (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning title=Notificări în aplicație::Lipsește secretul GOOGLE_SERVICES_JSON (GitHub → Settings → Secrets and variables → Actions): aplicația se construiește fără notificări."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if ! jq -e '.project_info.project_id and (.client[] | select(.client_info.android_client_info.package_name == "ro.servicehub.app"))' android/app/google-services.json > /dev/null; then
            echo "::error title=Notificări în aplicație::GOOGLE_SERVICES_JSON nu este fișierul google-services.json al aplicației ro.servicehub.app din Firebase."
            exit 1
          fi
          echo "Firebase config for ro.servicehub.app in place."

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Put it in the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/service-hub-test-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: service-hub-android-test
          path: out/*.apk
          retention-days: 14

      - name: Where to find it
        run: |
          {
            echo "### Aplicația Android de test"
            echo "Descarcă **service-hub-android-test** de la *Artifacts* (mai jos pe această pagină), dezarhivează și instalează fișierul .apk pe telefon."
            echo "Folosește proiectul Supabase **de test**."
          } >> "$GITHUB_STEP_SUMMARY"
