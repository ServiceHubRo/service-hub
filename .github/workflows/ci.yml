name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A8: known vulnerabilities in the packages the app ships (a warning on the run) and in the build
      # tools (the log only). Report only: an advisory published upstream must not block every pull request.
      - name: Dependency audit (report only)
        run: |
          npm audit --omit=dev || echo "::warning title=npm audit::A package the app ships has a known vulnerability (see this step's log)."
          npm audit || true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The same unit tests with the machine in the US and in Japan: no date or time may depend
      # on the device zone (T18, P17b).
      - name: Unit tests in other time zones
        run: |
          TZ=America/Los_Angeles npm test
          TZ=Asia/Tokyo npm test
      - run: npm run build
      - name: SQL tests (local Postgres)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          npm run test:sql

  e2e:
    name: Browser tests (390 / 820 / 1440 px)
    # Pinned: on ubuntu-latest = 26.04 (30 Oct 2026) Playwright 1.56 cannot install Chromium.
    runs-on: ubuntu-24.04
    # About 20 minutes with two workers (playwright.config.ts); room for a slower runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser and the system packages it asks for. When Ubuntu's package servers do not answer
      # (11 Nov 2026: the fonts could not be fetched, twice in a row), the browser alone: the runner
      # already has its libraries, the app brings its own font, and a browser that cannot start
      # fails the tests right after.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      # A throwaway Supabase on the runner (all migrations + supabase/seed/dev_seed.sql + Edge
      # Functions + a local mail catcher), so sign-up, email links and Cont are tested for real.
      # Never the real project.
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: Point the browser tests at it
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "E2E_BACKEND=1"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
