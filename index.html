<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161A" />
    <!-- The app is dark by design: browsers and dark-mode extensions (Dark Reader) must not darken it
         again — that turns the amber brown and the black wrench white. -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <meta
      name="description"
      content="Service-Hub: găsești un service auto în Brașov, te programezi din telefon și primești devizul în aplicație înainte să se lucreze ceva. Gratuit pentru șoferi."
    />
    <!-- Link previews (WhatsApp, Facebook, email). %SITE_URL% is set at build time (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="Service-Hub" />
    <meta property="og:title" content="Service-Hub — programări online la service auto" />
    <meta
      property="og:description"
      content="Programări auto fără telefoane. Devizul îl primești în aplicație și decizi tu. Gratuit pentru șoferi."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Service-Hub — programări online la service auto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Service-Hub" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Service-Hub — programări online la service auto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
